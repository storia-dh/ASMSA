<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mappa crediti NIN</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --brand:#6d5dfc; --paper:#fff; --line:#e4e7ec; }
    * { box-sizing: border-box; }
    html, body { height:100%; margin:0; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:#eef2f7; }
    .app { height:100%; min-height:420px; display:grid; grid-template-rows:auto 1fr; }
    header { z-index:1000; display:flex; align-items:center; gap:14px; padding:13px 18px; background:linear-gradient(105deg,rgba(255,255,255,.97),rgba(244,242,255,.97)); border-bottom:1px solid var(--line); box-shadow:0 4px 20px #10182812; }
    h1 { margin:0; font-size:clamp(1rem,2.5vw,1.35rem); letter-spacing:-.02em; }
    #status { margin-left:auto; color:var(--muted); font-size:.86rem; white-space:nowrap; }
    #map { width:100%; height:100%; min-height:360px; }
    #map.leaflet-container { background:#101827; touch-action:none; }
    .message { position:absolute; z-index:1100; inset:auto 16px 16px 16px; max-width:620px; padding:12px 14px; border-radius:10px; background:var(--paper); box-shadow:0 8px 30px #10182824; font-size:.9rem; line-height:1.45; }
    .message[hidden] { display:none; }
    .leaflet-popup-content { min-width:180px; line-height:1.45; }
    .popup-title { font-weight:750; margin-bottom:5px; }
    .popup-row { color:#475467; }
    .legend { background:rgba(255,255,255,.94); padding:9px 11px; border-radius:12px; box-shadow:0 5px 20px #1018281f; color:#475467; font-size:.78rem; line-height:1.35; }
    .legend-dot { display:inline-block; width:12px; height:12px; margin-right:6px; border-radius:50%; vertical-align:-2px; background:linear-gradient(135deg,#8b5cf6,#2563eb); }
    .credit-marker { display:grid; place-items:center; border:2px solid rgba(255,255,255,.95); border-radius:50%; color:#fff; background:linear-gradient(135deg,#8b5cf6 0%,#3b82f6 100%); box-shadow:0 4px 14px rgba(15,23,42,.38),0 0 0 3px rgba(124,92,246,.16); font-weight:700; font-size:11px; line-height:1; transition:transform .15s ease,filter .15s ease; }
    .credit-marker:hover { transform:scale(1.08); filter:saturate(1.12); }
    .leaflet-control-zoom a { color:#344054; }
    @media (max-width:560px) { header { padding:10px 12px; } #status { font-size:.76rem; } .app { min-height:340px; } }
  </style>
</head>
<body>
  <main class="app">
    <header><h1>Mappa crediti NIN</h1><div id="status" role="status">Caricamento…</div></header>
    <div id="map" aria-label="Mappa interattiva dei crediti NIN"></div>
    <div id="message" class="message" role="alert" hidden></div>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxZ1JcJy6VdGQnt3oy0v_xm4tqQSfombk-lw9rS0eQiPDg7_tO-GHxdFPaOR0wHqwdDyCRgYbZZPAZ/pub?gid=1913274688&single=true&output=csv';
    const map = L.map('map', {
      scrollWheelZoom:true, touchZoom:true, dragging:true, doubleClickZoom:true,
      boxZoom:true, keyboard:true, zoomControl:true, tap:false
    }).setView([42.2,12.5],5);
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:19, attribution:'Tiles &copy; Esri'
    }).addTo(map);
    L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxZoom:19, attribution:'Labels &copy; Esri', pane:'overlayPane'
    }).addTo(map);
    const statusEl = document.querySelector('#status');
    const messageEl = document.querySelector('#message');
    const escapeHtml = value => String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const number = value => {
      const normalized = String(value ?? '').trim().replace(',', '.');
      return normalized === '' ? NaN : Number(normalized);
    };
    const coordinatePair = (cells, labels) => {
      const values = cells.map(number);
      const latIndex=labels.findIndex(v=>/lat/i.test(v));
      const lonIndex=labels.findIndex(v=>/(lon|lng|long)/i.test(v));
      if (latIndex>=0 && lonIndex>=0 && Number.isFinite(values[latIndex]) && Number.isFinite(values[lonIndex])) return [values[latIndex],values[lonIndex]];
      for (let a=0; a<values.length; a++) for (let b=0; b<values.length; b++) {
        if (a === b) continue;
        if (Math.abs(values[a]) <= 90 && Math.abs(values[b]) <= 180 && Number.isFinite(values[a]) && Number.isFinite(values[b])) return [values[a], values[b]];
      }
      return null;
    };
    function showError(text) { statusEl.textContent='Dati non disponibili'; messageEl.textContent=text; messageEl.hidden=false; }
    Papa.parse(CSV_URL, {
      download:true, skipEmptyLines:true,
      complete(result) {
        if (!result.data?.length) return showError('Il foglio non contiene righe leggibili. Verifica che sia pubblicato sul web.');
        const header = result.data[0];
        const labels = header.slice(4,7).map((v,i) => v || `Colonna ${String.fromCharCode(69+i)}`);
        const groups=new Map(); let skipped=0;
        result.data.slice(1).forEach(row => {
          const cells=row.slice(4,7); const pair=coordinatePair(cells,labels);
          if (!pair) { skipped++; return; }
          const key=`${pair[0].toFixed(5)},${pair[1].toFixed(5)}`;
          if (!groups.has(key)) groups.set(key,{pair,rows:[]});
          groups.get(key).rows.push(cells);
        });
        const bounds=[]; let total=0; let maxCount=1;
        groups.forEach(group=>{ maxCount=Math.max(maxCount,group.rows.length); });
        groups.forEach(group=>{
          const count=group.rows.length; total+=count; bounds.push(group.pair);
          const title=group.rows[0].find(v=>v && !Number.isFinite(number(v))) || 'Località';
          const details=group.rows[0].map((v,i)=>v && !Number.isFinite(number(v)) && v!==title ? `<div class="popup-row"><strong>${escapeHtml(labels[i])}:</strong> ${escapeHtml(v)}</div>`:'').join('');
          const html=`<div class="popup-title">${escapeHtml(title)}</div><div class="popup-row"><strong>Occorrenze:</strong> ${count}</div>${details}`;
          const size=Math.round(18 + 24*Math.sqrt((count-1)/Math.max(1,maxCount-1)));
          const icon=L.divIcon({className:'',html:`<div class="credit-marker" style="width:${size}px;height:${size}px">${count>1?count:''}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2],popupAnchor:[0,-size/2]});
          L.marker(group.pair,{icon,riseOnHover:true,title:`${title}: ${count} occorrenze`}).addTo(map).bindPopup(html);
        });
        if (!bounds.length) return showError('Nelle colonne E, F e G non ho trovato una coppia di coordinate valida (latitudine e longitudine).');
        map.fitBounds(bounds,{padding:[28,28],maxZoom:14});
        statusEl.textContent=`${total} occorrenze · ${bounds.length} località${skipped ? ` · ${skipped} righe ignorate` : ''}`;
        const legend=L.control({position:'bottomright'});
        legend.onAdd=()=>{ const div=L.DomUtil.create('div','legend'); div.innerHTML='<span class="legend-dot"></span>Dimensione = numero di occorrenze'; return div; };
        legend.addTo(map);
        setTimeout(()=>map.invalidateSize(),100);
      },
      error() { showError('Non riesco a leggere il CSV. Controlla la pubblicazione del foglio e le autorizzazioni CORS.'); }
    });
    new ResizeObserver(()=>map.invalidateSize()).observe(document.querySelector('#map'));
  </script>
</body>
</html>
